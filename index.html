<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<title>
売れるカップ麺をつくろう！
</title>


<style>

body{

font-family:sans-serif;

max-width:750px;

margin:30px auto;

padding:20px;

line-height:1.7;

color:#333;

}


.box{

padding:20px;

background:#fff4f4;

border-radius:12px;

}


button{

display:block;

width:95%;

padding:13px;

margin:10px 0;

border-radius:8px;

border:1px solid #888;

background:white;

font-size:16px;

cursor:pointer;

}


button:hover{

background:#fff0f0;

}


input{

width:90%;

padding:10px;

font-size:16px;

}


.result{

background:#fff8f8;

padding:20px;

border-radius:12px;

}


table{

border-collapse:collapse;

width:100%;

}


td,th{

border:1px solid #aaa;

padding:8px;

}

</style>


</head>



<body>


<div class="box">


<h1>
売れるカップ麺をつくろう！
</h1>


<p>
あなたは食品メーカーの商品企画担当者です。
</p>


<p>
7つの質問に答えて、
「売れるカップ麺」を考えてみよう。
</p>


<p>
商品コンセプト、ターゲット、価格、広告など、
マーケティングの考え方を体験します。
</p>


</div>



<div id="app"></div>




<script>



const questions=[


[

"商品のコンセプトは？",

[

"若者向けの新しい味に挑戦するカップ麺",

"安くてお腹いっぱいになるカップ麺",

"健康を意識した体にやさしいカップ麺"

]

],



[

"ターゲットは？",

[

"高校生・大学生",

"忙しい会社員",

"健康を気にする大人"

]

],



[

"商品の特徴・材料は？",

[

"話題になる珍しい味や具材",

"量の多さや食べごたえ",

"低カロリー・健康素材"

]

],



[

"パッケージや名前は？",

[

"若者が手に取りたくなるデザイン",

"安さや量がすぐ分かるデザイン",

"高級感・安心感のあるデザイン"

]

],



[

"どこで販売する？",

[

"コンビニ中心",

"スーパー中心",

"ネット販売・専門店中心"

]

],



[

"価格はいくら？",

[

"128円程度",

"198円程度",

"298円程度"

]

],



[

"広告方法は？",

[

"SNSや動画で話題にする",

"店頭POPや試食で伝える",

"商品のこだわりを詳しく紹介する"

]

]


];



let step=0;


let answers=[];


let productName="";



function showQuestion(){


let app=document.getElementById("app");



if(step===questions.length){


showNameInput();


return;


}



let q=questions[step];



app.innerHTML=


`

<h2>
STEP ${step+1} / 7
</h2>


<h3>
${q[0]}
</h3>



${q[1].map(

(item,index)=>

`

<button onclick="selectAnswer(${index})">

${item}

</button>

`

).join("")}



`;



}




function selectAnswer(index){


answers.push(index);


step++;


showQuestion();


}




function showNameInput(){


let app=document.getElementById("app");



app.innerHTML=


`

<h2>
最後にカップ麺の商品名を決めよう！
</h2>


<p>
あなたが考えたカップ麺の商品名を入力してください。
</p>


<input id="name" placeholder="例：旨辛チャレンジ麺">


<button onclick="finish()">

商品企画を見る

</button>


`;

}

function finish(){


productName=document.getElementById("name").value;


if(productName===""){

productName="名前のないカップ麺";

}


showResult();


}





function showResult(){


let app=document.getElementById("app");


let score=0;



// 評価ロジック

// コンセプトとターゲットの組み合わせ

if(

(answers[0]===0 && answers[1]===0)

||

(answers[0]===1 && answers[1]===1)

||

(answers[0]===2 && answers[1]===2)

){

score+=2;

}



// 商品特徴とターゲット

if(

(answers[1]===0 && answers[2]===0)

||

(answers[1]===1 && answers[2]===1)

||

(answers[1]===2 && answers[2]===2)

){

score+=2;

}



// 価格と商品の方向性

if(

(answers[0]===1 && answers[5]===0)

||

(answers[0]===2 && answers[5]===2)

){

score+=2;

}



// 販売場所との相性

if(

answers[1]===0 && answers[4]===0

){

score+=1;

}




let evaluation="";



if(score>=5){


evaluation=

`

<h2>
🌟 とても可能性のある商品企画です！
</h2>


<p>
誰に売るのか、商品の特徴、価格、販売方法につながりがあります。
</p>


`;



}

else if(score>=3){


evaluation=

`

<h2>
👍 売れる可能性があります！
</h2>


<p>
良いアイデアがあります。
ただし、ターゲットと商品の特徴をさらに合わせると、もっと魅力的になります。
</p>


`;



}

else{


evaluation=

`

<h2>
💡 商品企画を見直してみよう！
</h2>


<p>
それぞれの選択には良さがあります。
しかしマーケティングでは、
「誰に、どんな価値を届けるか」
を考えることが重要です。
</p>


`;



}




// 選択内容一覧

let table="";


table+=`

<h3>
あなたが考えたカップ麺の商品企画
</h3>


<table>


<tr>

<th>
項目
</th>

<th>
選択内容
</th>

</tr>


`;




for(let i=0;i<questions.length;i++){


table+=`

<tr>

<td>

${questions[i][0]}

</td>


<td>

${questions[i][1][answers[i]]}

</td>


</tr>


`;

}



table+=`

</table>

`;






app.innerHTML=


`

<div class="result">


<h2>

「${productName}」

の商品企画結果

</h2>



${evaluation}



${table}




<h3>
グループ活動
</h3>


<p>

① なぜこのターゲットを選びましたか？

<br><br>

② 他の人のカップ麺と比べて、違うところはどこですか？

<br><br>

③ もっと売れる商品にするなら、何を変えますか？

<br><br>

④ 商品の一番の売り（強み）は何ですか？

</p>



</div>

`;



}




// 最初の質問を表示

showQuestion();



</script>


</body>


</html>
